version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: minimemo_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: minimemo_model_puller
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Ollama service...';
      while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Pulling llama3.2 model...';
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2\"}';
      echo 'Model pulled successfully!';
      "

  backend:
    build: .
    container_name: minimemo_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
      - ollama-pull-model
    restart: unless-stopped

volumes:
  ollama_data: